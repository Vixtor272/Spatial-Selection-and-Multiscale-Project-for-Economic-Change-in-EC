[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecuador-price"
version = "1.0.0"
description = "Multiscale Price-equation decomposition of Ecuador's formal economy (thesis code)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Victor Bastidas" }]
# Versions the thesis results were produced with (Python 3.13.12).
dependencies = [
    "numpy==2.4.6",
    "pandas==3.0.3",
    "pyarrow==24.0.0",
    "openpyxl==3.1.5",
    "scipy==1.17.1",
    "statsmodels==0.14.6",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "geopandas==1.1.3",
    "shapely==2.1.2",
    "imageio==2.37.3",
    "imageio-ffmpeg==0.6.0",
    "sympy==1.14.0",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel", "nbconvert"]

[tool.setuptools.packages.find]
include = ["ecuador_price*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]      # so the tests find ecuador_price without installing it
